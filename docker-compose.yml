version: "3.9"

services:
  crowntech-site:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crowntech-site
    restart: unless-stopped
    ports:
      - "80:80"

    # ─── Limites de recursos ────────────────────────────────────────────────
    # Site estático com Nginx consome pouquíssimo recurso.
    # Ajuste estes valores para controlar custo e precificação.
    deploy:
      resources:
        limits:
          cpus: "0.25"      # Máximo de 25% de 1 núcleo de CPU
          memory: 64M       # Máximo de 64 MB de RAM
        reservations:
          cpus: "0.05"      # CPU mínima garantida (5% de 1 núcleo)
          memory: 32M       # RAM mínima garantida

    # ─── Saúde do container ─────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
