# Deploy no servidor do Império de Bolso (Dokploy em 169.58.235.246). Lá a entrada 80/443 é o
# Traefik do Dokploy: os domínios (www.crowntech.com.br e crowntech.com.br → porta 3000, HTTPS
# Let's Encrypt) ficam na aba Domains do serviço. O docker-compose.yml continua o da VPS antiga.
services:
  crowntech-site:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
