<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" ry="20" fill="#1D4ED8"/>
  
  <!-- Crown shape: geometric & modern -->
  <!-- Base rectangle of crown -->
  <rect x="20" y="62" width="60" height="11" rx="3" fill="white"/>
  
  <!-- Left point of crown -->
  <polygon points="20,62 20,38 34,52 42,38" fill="white"/>
  
  <!-- Center tall point -->
  <polygon points="42,38 50,22 58,38 42,38" fill="white"/>

  <!-- Right point of crown -->
  <polygon points="58,38 66,52 80,38 80,62" fill="white"/>

  <!-- Gold accent dots on top of each point -->
  <circle cx="20" cy="38" r="5" fill="#F59E0B"/>
  <circle cx="50" cy="22" r="5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="5" fill="#F59E0B"/>
</svg>
